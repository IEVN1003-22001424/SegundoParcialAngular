<section class="img-fondo">
    <div class="flex items-center justify-center m-4 ">
        <p class="italic text-3xl font-bold text-white">Cinepolis</p>
    </div>

    <div class="flex  items-center justify-center gap-4 " >

        <!-- Entradas -->
        <div class="p-6 border rounded shadow text-center text-white">

            <h1 class="font-bold text-xl mb-5">Entradas</h1> 

            <form class="grid grid-cols-2 space-y-2 font-bold text-white" [formGroup]="formularioc">

                <label for="nombre">Nombre: </label>
                <input class="text-black" type="text" id="nombre" name="nombre" required formControlName="nombre">

                <label for="cantidad-compradores">Cantidad de Compradores: </label>
                <input class="text-black" type="number" id="cantidad-compradores" min="1" required formControlName="compradores">

                <label for="cantidad-boletos">Cantidad de Boletos: </label>
                <input class="text-black" type="number" id="cantidad-boletos" min="1" required formControlName="boletos">

                <label for="tarjeta-cineco" >Tarjeta Cineco: </label>
                <div>
                    <label for="tarjeta-si">Sí</label>
                    <input  class="m-2" type="radio" id="tarjeta-si" formControlName="tarjeta" value="Si">

                    <label for="tarjeta-no">No</label>
                    <input class="m-2" type="radio" id="tarjeta-no" formControlName="tarjeta" value="No">
                </div>

            </form>

        </div>

        <!-- Salidas -->
        <div class="p-6 border rounded shadow text-center font-bold text-white">

            <h1 class="font-bold text-xl mb-5">Salidas</h1>
            <h3 class="font-bold text-xl mb-5">{{mensaje}}</h3>
            <h3 class="font-bold text-xl mb-5">{{nombre}}</h3>
            <label for="pagar">Valor a Pagar: </label>
            <input class="text-black" type="text" [value]="total">

        </div>

    </div>

    <!-- Acciones -->
    <div class=" flex items-center justify-center m-5 font-bold text-white">
        <div class="p-6 border rounded shadow text-center gap-4">
            <button class="m-2 bg-white text-black p-2 rounded hover:bg-blue-200 cursor-pointer active:scale-95" type="button" (click)="MuestraCliente()">Procesar</button>
            <button class="m-2 bg-white text-black p-2 rounded hover:bg-blue-200 cursor-pointer active:scale-95" type="button" (click)="Salir()">Salir</button>
            <a [routerLink]="['/escuela/ventas']" class="m-2 bg-white text-black p-2 rounded hover:bg-blue-200 cursor-pointer active:scale-95" type="button">Mostrar Ventas</a>
        </div>
    </div>

</section>
